# Release: build+push this app's image, then trigger its deploy on lily.
#
# This app's deploy.sh + compose live in the INFRA repo (TheDevs-cz/lily.srv,
# apps/msp-oauth2-demo). This workflow does NOT deploy directly (no SSH key here):
# it builds+pushes the ghcr image and triggers the deploy via the shared reusable
# workflow, which HMAC-POSTs https://deploy.lily.srv.thedevs.cz/hooks/msp-oauth2-demo.
# The box's receiver verifies the per-app HMAC and a root systemd executor runs
# /srv/msp-oauth2-demo/deploy.sh <tag>. A leak of the secret below can therefore only
# ever redeploy THIS app from THIS image — nothing else.
#
# Requires GH secret DEPLOY_WEBHOOK_SECRET (per-app HMAC key). Passed EXPLICITLY,
# NOT via `secrets: inherit` — inherit does not cross owners and the shared CI repo
# (TheDevs-cz) is a different owner than this one. GITHUB_TOKEN is automatic.
#
# Replaces the previous build-only workflow: the deploy used to be triggered from the
# TheDevs-cz/spare.srv repo (path-filtered on its deployment dir, so a code push here
# rebuilt the image but never actually redeployed). Migrated to lily 2026-07-27.

name: Release

# push to main ONLY — public repo, so never pull_request_target / untrusted PR code.
on:
    push:
        branches:
            - main

permissions:
    contents: read
    packages: write

jobs:
    ship:
        uses: TheDevs-cz/ci/.github/workflows/_ship.yml@v1
        secrets:
            DEPLOY_WEBHOOK_SECRET: ${{ secrets.DEPLOY_WEBHOOK_SECRET }}
        with:
            # app id == hook id == apps/msp-oauth2-demo/ == /srv/msp-oauth2-demo/ on
            # the box == the Infisical project name. NOT the repo name.
            app: msp-oauth2-demo
            # Explicit: the ghcr package is named after the REPO, which differs from
            # the app id above. Must match `image:` in the infra repo's compose.yaml.
            image: ghcr.io/myspeedpuzzling/oauth2-client-demo-application
            deploy_host: lily.srv.thedevs.cz
            # Deploy the exact immutable sha-<git-sha> tag this run just built,
            # instead of the floating "main" — re-runnable and unambiguous.
            deploy_sha: true
            # Fire-and-forget: this run goes green once the box ACCEPTS the signed
            # trigger, not when the deploy finishes. Waiting for the real result
            # (D27) needs a per-app fine-grained checks:write PAT seeded in the box's
            # /srv/deploy/checks.env — not set up for this repo yet. Deploy logs live
            # on the box: Grafana app="deploy" / journalctl -u lily-deploy-runner.
            # Flip to true once that token exists.
            await_deploy: false
